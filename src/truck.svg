<svg class="truck-svg" viewBox="0 0 900 440" role="img" aria-label="Hình minh họa xe tải Đình Thư" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .wheel { fill: #202c28; stroke: #d2cbbb; stroke-width: 4; }
      .wheel .tire-inner { fill: #333f39; stroke: #101b17; stroke-width: 3; }
      .wheel .hub { fill: #c0b8a6; stroke: #263d36; stroke-width: 4; }
      .wheel path { fill: none; stroke: #b5ad9c; stroke-width: 4; stroke-linecap: round; }
    </style>
    <filter id="truckShadow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="bodyPaint" x1="0" x2="0.18" y1="0" y2="1">
      <stop stop-color="#f8f4ea"/>
      <stop offset="1" stop-color="#dbd6c6"/>
    </linearGradient>
    <linearGradient id="cabPaint" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#ff7a55"/>
      <stop offset="1" stop-color="#e34f34"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#d0e9e4"/>
      <stop offset="1" stop-color="#7aa19a"/>
    </linearGradient>
    <linearGradient id="grilleGrad" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#34463f"/>
      <stop offset="1" stop-color="#23342e"/>
    </linearGradient>
  </defs>

  <!-- Bóng đổ hình elip dẹt nằm sát mặt đường, ngay dưới bánh xe (tâm y=397) -->
  <ellipse cx="454" cy="397" rx="385" ry="11" fill="#142c24" opacity=".26" filter="url(#truckShadow)"/>

  <!-- Nhóm thân xe (thùng xe + cabin), rung nhẹ khi xe đang lăn bánh trên đường -->
  <g class="truck-body">
    <!-- Bóng viền thùng xe -->
    <path d="M91 136q0-12 12-12h481q15 0 15 15v207H91z" fill="#19372f" opacity=".16" transform="translate(0 6)"/>

    <!-- Thùng xe chính -->
    <path d="M97 127q0-13 13-13h478q12 0 12 13v210H97z" fill="url(#bodyPaint)" stroke="#233b34" stroke-width="8" stroke-linejoin="round"/>

    <!-- Dải cam đặc trưng ở mép trên thùng xe -->
    <path d="M105 135h486v31H105z" fill="#f16b49"/>
    <path d="M105 166h486" stroke="#c95232" stroke-width="2"/>

    <!-- Gờ tôn đứng mảnh trên thùng xe -->
    <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".55">
      <path d="M152 178v124M198 178v124M244 178v124"/>
      <path d="M440 178v124M486 178v124M532 178v124"/>
    </g>
    <g stroke="#aca697" stroke-width="1.5" stroke-linecap="round" opacity=".5">
      <path d="M154 178v124M200 178v124M246 178v124"/>
      <path d="M442 178v124M488 178v124M534 178v124"/>
    </g>

    <!-- Chữ ĐÌNH THƯ lớn, đậm, nằm chính giữa thân thùng xe, không đè lên thanh cam -->
    <text x="342" y="235" text-anchor="middle" fill="#22362f" font-family="'Baloo 2', 'Be Vietnam Pro', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="1.5">ĐÌNH THƯ</text>
    <!-- Dòng Quảng Ngãi nhỏ hơn, bên dưới -->
    <text x="342" y="262" text-anchor="middle" fill="#4d5f57" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">QUẢNG NGÃI</text>

    <!-- Khung gầm / cản hông đáy thùng xe -->
    <path d="M107 312h491v24q0 8-8 8H108q-7 0-7-8v-15z" fill="#2c4038"/>

    <!-- CABIN ĐẦU VUÔNG THACO OLLIN 500B -->
    <path d="M600 336V156h150q15 0 22 14l5 22 2 84q0 12-6 22l-1 38H600z" fill="url(#cabPaint)" stroke="#263f37" stroke-width="8" stroke-linejoin="round"/>

    <!-- Kính hông cửa sổ buồng lái -->
    <path d="M615 168h80v68h-80q-4 0-4-6v-56q0-6 4-6z" fill="url(#glass)" stroke="#263f37" stroke-width="5" stroke-linejoin="round"/>
    <!-- Kính chắn gió phía trước (mặt trước gần thẳng đứng) -->
    <path d="M707 168h42q11 0 16 12l2 56h-60z" fill="url(#glass)" stroke="#263f37" stroke-width="5" stroke-linejoin="round"/>
    <path d="M722 173l35 4-10 42h-8z" fill="#ffffff" opacity=".28"/>

    <path d="M700 168v70M610 244h160" stroke="#263f37" stroke-width="3" opacity=".6"/>

    <!-- Tay nắm cửa buồng lái -->
    <rect x="636" y="262" width="22" height="7" rx="3.5" fill="#4e5f58" stroke="#253e36" stroke-width="1.5"/>

    <!-- Mặt ca-lăng tản nhiệt Thaco Ollin đầu vuông -->
    <rect x="734" y="260" width="38" height="28" rx="3" fill="url(#grilleGrad)" stroke="#263f37" stroke-width="3"/>
    <path d="M738 268h30M738 274h30M738 280h30" stroke="#71867e" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Cụm đèn pha đứng xe Thaco Ollin 500B -->
    <rect x="758" y="293" width="16" height="27" rx="3" fill="#fff5d2" stroke="#263f37" stroke-width="3.5"/>
    <rect x="760" y="296" width="12" height="11" rx="2" fill="#fff" opacity=".8"/>
    <rect x="760" y="310" width="12" height="7" rx="1.5" fill="#f89d38"/>

    <!-- Gương chiếu hậu đôi Thaco gắn cột A -->
    <path d="M748 180h16M756 180v38" stroke="#253e37" stroke-width="3" stroke-linecap="round"/>
    <rect x="762" y="174" width="7" height="20" rx="2" fill="#30443d" stroke="#253e37" stroke-width="2"/>
    <rect x="762" y="198" width="7" height="11" rx="2" fill="#30443d" stroke="#253e37" stroke-width="2"/>

    <!-- Cản trước & Bậc lên xuống cabin -->
    <path d="M720 326h56v11h-56z" fill="#2c4038" stroke="#263f37" stroke-width="3"/>
    <path d="M605 324h32v12h-32z" fill="#384f46" stroke="#263f37" stroke-width="2"/>

    <!-- Bản lề và khóa thùng xe phía sau -->
    <path d="M89 220v102" stroke="#263d36" stroke-width="8"/>
    <path d="M103 314h9v13h-9z" fill="#f7c969"/>
  </g>

  <!-- Dầm sắt chassis & cản sau xe -->
  <path d="M157 351h533" stroke="#263d36" stroke-width="14" stroke-linecap="round"/>
  <path d="M91 337h698" stroke="#233a33" stroke-width="8" stroke-linecap="round"/>

  <!-- Hốc chắn bùn ôm bánh xe -->
  <path d="M118 348a58 58 0 0 1 110 0" fill="none" stroke="#243b34" stroke-width="8" stroke-linecap="round"/>
  <path d="M634 348a58 58 0 0 1 110 0" fill="none" stroke="#243b34" stroke-width="8" stroke-linecap="round"/>

  <!-- BÁNH XE (Đáy bánh xe tại cy+r = 347+50 = 397px) -->
  <!-- Bánh sau -->
  <g class="wheel wheel--one">
    <circle cx="173" cy="347" r="50"/>
    <circle class="tire-inner" cx="173" cy="347" r="35"/>
    <circle class="hub" cx="173" cy="347" r="19"/>
    <path d="M173 309v76m-38-38h76m-65-27 54 54m0-54-54 54"/>
  </g>

  <!-- Bánh trước -->
  <g class="wheel wheel--two">
    <circle cx="689" cy="347" r="50"/>
    <circle class="tire-inner" cx="689" cy="347" r="35"/>
    <circle class="hub" cx="689" cy="347" r="19"/>
    <path d="M689 309v76m-38-38h76m-65-27 54 54m0-54-54 54"/>
  </g>
</svg>
